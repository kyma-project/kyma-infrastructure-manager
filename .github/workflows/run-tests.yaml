name: tests

on:
  workflow_call:
  push:
    branches:
      - main
    paths-ignore:
      - .reuse
      - LICENSES/
      - LICENSE
      - .gitignore
      - "**.md"

  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - .reuse
      - LICENSES/
      - LICENSE
      - .gitignore
      - "**.md"
env:
  GITHUB_BASELINE_WORKFLOW_REF: "tests"

permissions:
  contents: read
  
jobs:
# lint:
############################################################################################
  unit-tests:
    runs-on: ubuntu-latest
    steps:
############################################################################################
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
############################################################################################
    - name: Set up cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          /home/runner/work/infrastructure-manager/infrastructure-manager/bin
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
############################################################################################
    - name: Set up go environment
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: 'go.mod'
############################################################################################
    - name: Run unit tests
      run: |
        set -o pipefail 
        make test 2>&1 | tee test-output.txt
    - name: Upload test output artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: success() || failure()
      with:
        name: "test-output"
        path: "test-output.txt"
    - name: Upload coverage artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      if: success() || failure()
      with:
        name: "code-coverage"
        path: "coverage.txt"
    - name: filter out coverage
      run: |
        #!/bin/bash

        filters=(
            "mock"
            "test"
            "github.com/kyma-project/infrastructure-manager/api"
        )

        input="./coverage.txt"
        output="./coverage-filtered.txt"

        cp "$input" "$output"

        for i in "${filters[@]}"; do
          echo "filtering $i"
          cp "$output" "$output~"
          grep --invert-match $i "$output~" > "$output"
          wc -l $output
        done
        rm "$output~"

# coverallsapp has an outage that causes the upload to fail, so we disable the coveralls upload for now
# to avoid failing the whole workflow and the entire release. We can re-enable it once the outage is resolved.

