name: KIM Release

on:
  push:
    tags:
      - '*'  # Trigger on tag pushes

jobs:
  run-release-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yaml

  generate-release:
    needs: run-release-tests
    if: needs.run-release-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for creating releases and uploading assets
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Install crd-ref-docs tool
        run: go install github.com/elastic/crd-ref-docs@latest

      - name: Generate CRD documentation
        run: |
          $HOME/go/bin/crd-ref-docs \
            --renderer=markdown \
            --source-path=./api \
            --config=./config/crd/crd-doc-config.yaml \
            --output-path=./config/crd/crd-docs.md

      - name: Create Release and Generate Notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ./config/crd/crd-docs.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-release-report:
    needs: generate-release
    if: needs.generate-release.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/upload-release-report.yaml
    with:
      release_version: ${{ github.ref_name }}
    secrets:
      RELEASE_LOG_UPLOADER_SA: ${{ secrets.RELEASE_LOG_UPLOADER_SA }}

